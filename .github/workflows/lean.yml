name: Lean

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lean-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_evals.py
      - run: python3 scripts/check_lean_evals.py -j 2
      - run: python3 tests/lean_check/run_tests.py
