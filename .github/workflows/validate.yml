name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  eval-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_evals.py
